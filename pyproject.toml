[project]
name = "whisper-transcribe"
version = "0.10.1"
description = "Streamlit application for transcription and translation using OpenAI Whisper on Apple Silicon with MLX."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Direct, not transitive-via-mlx-whisper: streamlit_app imports mlx.core to
    # call mx.clear_cache() after each batch. mlx-whisper would pull it in
    # regardless, but an undeclared import breaks the moment that stops being true.
    # The floor is a real API minimum, not caution: mx.clear_cache() does not exist
    # at 0.22.1 (checked directly, along with 0.20.0), and does at 0.24.2. 0.23.0
    # is untested because it ships no cp313 wheel, so the floor is the lowest
    # version actually confirmed rather than the lowest that might work.
    "mlx>=0.24.2",
    "mlx-whisper",
    "streamlit>=1.59",
    "yt-dlp",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "watchdog",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ty.environment]
python-version = "3.12"
