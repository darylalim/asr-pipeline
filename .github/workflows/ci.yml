name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Apple Silicon. Do NOT switch to ubuntu-latest: mlx pulls its compute
    # backend unconditionally only on Darwin, so Linux resolves and installs
    # cleanly, then dies at `import mlx_whisper`. See CLAUDE.md.
    runs-on: macos-14
    timeout-minutes: 15
    # There is no .python-version, so an unpinned run takes uv's newest default
    # while requires-python and [tool.ty.environment] both say 3.12.
    env:
      UV_PYTHON: "3.12"
    steps:
      # Every action is pinned to a full commit SHA — a tag is mutable, so a
      # compromised or force-moved tag would run arbitrary code with this
      # workflow's token. Keep the trailing version comment in sync on bumps.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true # mlx-whisper pulls torch (504 MB); a cold cache dominates the run

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q
